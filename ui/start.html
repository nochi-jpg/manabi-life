<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>まなびライフ はじめから</title>
<link rel="stylesheet" href="base.css">
<style>
.step{position:absolute;inset:0;display:none}.step.on{display:block;animation:pop .25s}
.q{position:absolute;left:0;right:0;top:60px;text-align:center;font-size:32px;font-weight:900;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.q small{display:block;font-size:16px;color:#9fb4dc;font-weight:700;margin-top:6px;text-shadow:none}
.dots{position:absolute;left:0;right:0;top:28px;display:flex;justify-content:center;gap:8px}
.dots i{width:40px;height:6px;border-radius:3px;background:rgba(255,255,255,.25)}.dots i.on{background:var(--cyan)}
/* 性別 */
.sex{position:absolute;top:180px;width:360px;height:380px;padding:16px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .15s}
.sex:hover{transform:translateY(-4px)}
.sex .pic{width:320px;height:200px;border-radius:14px;background:center/cover;background-color:#eef4fb}
.sex .l{margin-top:18px;font-size:34px;font-weight:900}
.sex .d{margin-top:6px;font-size:14px;color:var(--ink2)}
.sex.sel{box-shadow:0 0 0 5px var(--cyan),0 0 30px rgba(30,200,234,.6),0 10px 22px rgba(5,10,40,.45)}
#sM{left:240px}#sF{left:680px}
#sM .l{color:#2f6aa8}#sF .l{color:#d64a86}
/* 名前 */
#nm{left:190px;top:170px;width:900px;height:360px;padding:26px 34px}
.row{display:grid;grid-template-columns:80px 1fr 64px;align-items:center;column-gap:14px;margin-bottom:22px}
.row .k{font-size:18px;color:var(--ink2)}
.field{height:96px;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 3px #e6cfa5;display:flex;flex-direction:column;justify-content:center;padding:0 22px}
.field .kana{font-size:16px;color:var(--ink2);height:20px}
.field .kj{font-size:44px;font-weight:900;line-height:1.1}
.field input{font-family:var(--f);font-weight:900;font-size:40px;border:0;outline:0;background:transparent;color:var(--ink);width:100%}
.field input.kana{font-size:16px;font-weight:700;color:var(--ink2);height:22px}
.row .sh{width:64px;height:64px;border-radius:50%;font-size:28px;padding:0}
.full{text-align:center;font-size:18px;color:var(--ink2)}.full b{font-size:24px;color:var(--ink)}
#self{position:absolute;left:390px;top:560px;width:240px;height:56px;font-size:19px}
#ok{position:absolute;left:650px;top:560px;width:240px;height:56px;font-size:19px}
#back{position:absolute;left:40px;top:640px;width:150px;height:46px;font-size:16px}
.opts4{position:absolute;left:240px;right:240px;top:200px;display:grid;grid-template-columns:1fr;gap:var(--sp3)}
.pick{height:84px;border-radius:20px;display:grid;grid-template-columns:64px 1fr;align-items:center;column-gap:var(--sp2);padding:0 var(--sp4);font-size:24px;text-align:left}
.pick .i{font-size:40px;text-align:center}
.opts2{position:absolute;left:160px;right:160px;top:220px;display:grid;grid-template-columns:1fr 1fr;gap:var(--sp4)}
.pick.mode{height:300px;grid-template-columns:1fr;grid-template-rows:auto auto 1fr;justify-items:center;align-content:start;row-gap:var(--sp2);padding:var(--sp4);text-align:center}
.pick.mode .i{font-size:72px}
.pick.mode .l{font-size:30px}
.pick.mode .d{font-size:17px;line-height:1.6;color:var(--ink2);font-weight:700}
.note{position:absolute;left:0;right:0;top:636px;text-align:center;font-size:14px;color:#9fb4dc}
</style></head>
<body>
<div id="stage">
  <!-- 1. 性別 -->
  <div class="step on" id="st1">
    <div class="dots"><i class="on"></i><i></i><i></i><i></i></div>
    <div class="q">どちらで 生まれる？<small>あとから変えることはできません</small></div>
    <div class="pearl sex" id="sM" data-g="M"><div class="pic" style="background-image:url(../assets/faces/M_20.png)"></div><div class="l">👦 男の子</div><div class="d">0歳から人生がはじまります</div></div>
    <div class="pearl sex" id="sF" data-g="F"><div class="pic" style="background-image:url(../assets/faces/F_20.png)"></div><div class="l">👧 女の子</div><div class="d">0歳から人生がはじまります</div></div>
  </div>
  <!-- 2. 幸せの基準 -->
  <div class="step" id="stH">
    <div class="dots"><i class="on"></i><i class="on"></i><i></i><i></i></div>
    <div class="q">あなたにとって、幸せのいちばんの基準は？<small>答えはゲーム中には出ません。人生の終わりに、この基準でも点数がつきます</small></div>
    <div class="opts4">
      <button class="pick" data-n="stM"><span class="i">🎨</span><span>自分のやりたいことをやること</span></button>
      <button class="pick" data-n="stM"><span class="i">🤝</span><span>たくさんの人とかかわること</span></button>
      <button class="pick" data-n="stM"><span class="i">💰</span><span>大金持ちになること</span></button>
      <button class="pick" data-n="stM"><span class="i">🏡</span><span>家族と平穏に暮らすこと</span></button>
    </div>
  </div>
  <!-- 3. モード -->
  <div class="step" id="stM">
    <div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
    <div class="q">どちらのモードで生きる？<small>あとから変えることはできません</small></div>
    <div class="opts2">
      <button class="pick mode" data-n="st2"><span class="i">🌏</span><span class="l">現実的モード</span><span class="d">日本の統計どおり。病気・事故・別れ・犯罪など、つらいできごとも起こります</span></button>
      <button class="pick mode" data-n="st2"><span class="i">🌷</span><span class="l">おだやかモード</span><span class="d">死・がん・離婚・逮捕などのできごとは起こりません</span></button>
    </div>
  </div>
  <!-- 4. 名前 -->
  <div class="step" id="st2">
    <div class="dots"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>
    <div class="q">名前は？<small>🔀 でべつの名前に。自分で決めることもできます</small></div>
    <div class="pearl" id="nm">
      <div class="row"><span class="k">苗字</span><div class="field" id="fS"><span class="kana"></span><span class="kj"></span></div><button class="gl g-cyan sh" id="shS">🔀</button></div>
      <div class="row"><span class="k">名前</span><div class="field" id="fG"><span class="kana"></span><span class="kj"></span></div><button class="gl g-cyan sh" id="shG">🔀</button></div>
      <div class="full">この名前で生まれます：<b id="full"></b></div>
    </div>
    <button class="gl g-navy" id="self">✏️ 自分で決める</button>
    <button class="gl g-green" id="ok">この名前で生まれる ▶</button>
    <button class="gl g-navy" id="back">◀ もどる</button>
  </div>
</div>
<script>
const st=document.getElementById('stage');function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);st.style.transform=`translate(-50%,-50%) scale(${s})`}addEventListener('resize',fit);fit();
const SUR=[['佐藤','さとう'],['鈴木','すずき'],['高橋','たかはし'],['田中','たなか'],['伊藤','いとう'],['渡辺','わたなべ'],['山本','やまもと'],['中村','なかむら'],['小林','こばやし'],['加藤','かとう'],['吉田','よしだ'],['山田','やまだ'],['松本','まつもと'],['井上','いのうえ'],['木村','きむら']];
const GIV={M:[['大翔','ひろと'],['悠真','ゆうま'],['蓮','れん'],['颯太','そうた'],['湊','みなと'],['陽翔','はると'],['健太','けんた'],['樹','いつき']],F:[['さくら','さくら'],['陽菜','ひな'],['結衣','ゆい'],['葵','あおい'],['美咲','みさき'],['楓','かえで'],['芽依','めい'],['遥','はるか']]};
let g='F',S=['高橋','たかはし'],G=['さくら','さくら'],self=false;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function draw(){
  for(const [id,v] of [['fS',S],['fG',G]]){const f=document.getElementById(id);
    f.innerHTML=self?`<input class="kana" value="${v[1]}" placeholder="ふりがな"><input value="${v[0]}" maxlength="6">`:`<span class="kana">${v[1]}</span><span class="kj">${v[0]}</span>`}
  document.getElementById('full').textContent=`${S[0]} ${G[0]}（${S[1]} ${G[1]}）`;
}
document.querySelectorAll('.sex').forEach(c=>c.onclick=()=>{g=c.dataset.g;document.querySelectorAll('.sex').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');
  G=pick(GIV[g]);setTimeout(()=>go('stH'),250)});
function go(id){document.querySelectorAll('.step').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');if(id==='st2')draw()}
document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>go(b.dataset.n));
document.getElementById('shS').onclick=()=>{S=pick(SUR);self=false;draw()};
document.getElementById('shG').onclick=()=>{G=pick(GIV[g]);self=false;draw()};
document.getElementById('self').onclick=()=>{self=true;draw()};
document.getElementById('back').onclick=()=>go('stM');
if(location.hash==='#hp')go('stH');if(location.hash==='#mode')go('stM');
document.getElementById('ok').onclick=()=>location.href='birth.html';
if(location.hash==='#name'){document.getElementById('st1').classList.remove('on');document.getElementById('st2').classList.add('on');draw()}
if(location.hash==='#self'){document.getElementById('st1').classList.remove('on');document.getElementById('st2').classList.add('on');self=true;draw()}
</script>
</body></html>
