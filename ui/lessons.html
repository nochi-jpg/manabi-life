<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>まなびライフ 習い事を続ける？</title>
<link rel="stylesheet" href="base.css">
<style>
#stage{background:#fdfdfb}#stage::before{display:none}
#behind{position:absolute;inset:0;background:url(../docs/ui/theme-whiteblue-main.png) center/cover;filter:blur(2px)}
.ov{background:rgba(253,253,251,.85)}
#box{position:relative;width:820px;padding:var(--sp4) var(--sp5) var(--sp4);color:var(--ink);background:#fff;border:2px solid #dfe7f3;border-radius:24px;box-shadow:0 16px 40px rgba(47,106,168,.18)}
.cs{position:absolute;left:24px;top:-20px;height:38px;padding:0 16px;border-radius:999px;display:flex;align-items:center;gap:6px;font-size:16px;color:#fff;background:var(--blue)}
.q{font-size:22px;line-height:1.5}.q small{display:block;font-size:14px;color:var(--ink2)}
.ls{margin-top:var(--sp2)}
.l{display:grid;grid-template-columns:44px 1fr 120px 120px;column-gap:var(--sp2);align-items:center;height:72px;border-bottom:2px solid #eef3fa}
.l .e{font-size:30px;text-align:center}
.l .n{font-size:20px;line-height:1.3}.l .n small{display:block;font-size:13px;color:var(--ink2)}
.l button{height:44px;font-size:16px;color:var(--blue);background:#fff;border:2px solid #c9d7ea;border-radius:999px;box-shadow:none}
.l button.on{color:#fff;background:var(--blue);border-color:var(--blue)}
.l button.q2.on{background:#8a97b5;border-color:#8a97b5}
.sum{margin-top:var(--sp2);display:grid;grid-template-columns:44px 1fr;column-gap:var(--sp2);font-size:15px;color:var(--ink2)}
.sum b{color:var(--ink)}
#ok{margin-top:var(--sp4);width:100%;height:56px;font-size:19px;color:#fff;background:var(--blue);border:0;border-radius:999px;box-shadow:0 3px 0 #1f4f82}
.src{margin-top:var(--sp2)}
</style></head><body>
<div id="stage"><div id="behind"></div>
<div class="ov"><div id="box">
  <div class="cs">🎒 中学校に入学 ・ 2022年4月</div>
  <div class="q">中学生になる。習い事はどうする？<small>部活と勉強がいそがしくなります。続けるものを選ぼう</small></div>
  <div class="ls">
    <div class="l"><span class="e">🎹</span><span class="n">ピアノ<small>6年目 ・ 月8,000円 ・ 芸術↑ 満足感↑</small></span><button class="on">続ける</button><button class="q2">やめる</button></div>
    <div class="l"><span class="e">🏊</span><span class="n">スイミング<small>5年目 ・ 月7,000円 ・ 体力↑ 健康↑</small></span><button>続ける</button><button class="q2 on">やめる</button></div>
    <div class="l"><span class="e">✏️</span><span class="n">学習塾<small>1年目 ・ 月25,000円 ・ 学力↑ ストレス↑</small></span><button class="on">続ける</button><button class="q2">やめる</button></div>
  </div>
  <div class="sum"><span>💡</span><span>続けると：<b>月33,000円</b>（家計から） ／ 中学生で習い事を続ける人は約半分です</span></div>
  <button id="ok">これで決める ▶</button>
  <div class="src"><span>📊</span><span>習い事をしている子は小学生で約7割、中学生で約4割です。<small>（ベネッセ教育総合研究所）</small></span></div>
</div></div></div>
<script>const st=document.getElementById('stage');function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);st.style.transform=`translate(-50%,-50%) scale(${s})`}addEventListener('resize',fit);fit();
document.querySelectorAll('.l').forEach(r=>r.querySelectorAll('button').forEach(b=>b.onclick=()=>{r.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}))</script>
</body></html>
